name: Deploy to Hugging Face Spaces

# Mirrors main to the two Hugging Face Spaces. A Space is a separate git
# remote, not a GitHub mirror, so merging to main does not update it on its
# own — without this workflow the live API keeps serving whatever was last
# pushed to the Space by hand.
#
# Deployment is GATED on model performance: the `evaluate` job scores every
# checkpoint against the HC18 reference annotations and the `deploy` job only
# runs if the gates in scripts/eval_thresholds.py pass. A regression does not
# reach production.
#
# Required repository secret:
#   HF_TOKEN — a Hugging Face access token with **write** permission
#              (https://huggingface.co/settings/tokens)
#
# Optional repository variables (fall back to the values below if unset):
#   HF_API_SPACE       — default TarunSadarla2606/fetal-head-clinical-ai-api
#   HF_STREAMLIT_SPACE — default TarunSadarla2606/fetal-head-clinical-ai

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which Space to push
        required: true
        default: both
        type: choice
        options: [both, api, streamlit]

concurrency:
  # Never let two pushes race the same Space remote.
  group: deploy-hf
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate + gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mae_summary: ${{ steps.gate.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Real weights, not LFS pointers — evaluating pointer files would
          # fail to load every checkpoint, which the gate treats as a failure
          # rather than a skip.
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation
        run: python scripts/evaluate.py --out eval_results.json

      - name: Enforce release gates
        id: gate
        run: |
          # --require names the variants explicitly so a checkpoint that
          # silently stopped being evaluated fails the build instead of
          # shrinking the gate to whatever happened to load.
          python scripts/check_thresholds.py eval_results.json \
            --require phase0 phase4a phase2 phase4b | tee gate.log
          echo "summary=$(head -1 gate.log)" >> "$GITHUB_OUTPUT"

      - name: Refresh the model card with this run's numbers
        run: python scripts/render_model_card.py eval_results.json

      - name: Commit the refreshed model card
        # Only the autogenerated metrics block changes; the prose is
        # hand-written and the renderer refuses to touch it. [skip ci] stops
        # this commit from triggering the workflow again.
        run: |
          set -euo pipefail
          if git diff --quiet -- MODEL_CARD.md; then
            echo "Model card already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODEL_CARD.md
          git commit -m "chore: refresh model card metrics [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval_results.json
            gate.log

  deploy:
    name: Push to HF Space
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - name: Check HF_TOKEN is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set. Add a write-scoped token at" \
                 "Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Spaces need the real model weights, not LFS pointer files.
          lfs: true
          # A Space rejects a shallow history; fetch everything.
          fetch-depth: 0

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push to Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          API_SPACE: ${{ vars.HF_API_SPACE || 'TarunSadarla2606/fetal-head-clinical-ai-api' }}
          STREAMLIT_SPACE: ${{ vars.HF_STREAMLIT_SPACE || 'TarunSadarla2606/fetal-head-clinical-ai' }}
          TARGET: ${{ github.event.inputs.target || 'both' }}
        run: |
          set -euo pipefail

          # Push a single squashed snapshot, not the GitHub history.
          #
          # Hugging Face runs a pre-receive hook that rejects any non-LFS file
          # over 10 MiB *anywhere in the push*. Squashing solves two problems
          # at once:
          #
          #  1. History. 4a/4b weights were committed as raw blobs before
          #     .gitattributes tracked *.pth, so pushing full history is
          #     rejected no matter how clean the current tree is.
          #  2. Conversion. Re-staging here runs those files — real bytes,
          #     materialised by the lfs:true checkout — back through the *.pth
          #     LFS filter, so the snapshot carries pointers even though the
          #     source commit does not, and the objects upload to HF's LFS
          #     store on push. Nothing has to be rewritten on the GitHub side.
          #
          # A Space is a deployment target, not a history archive, so a
          # one-commit snapshot is what it actually wants — and it keeps the
          # Space repo small.
          git checkout --orphan hf-deploy

          # HF rejects *binary* files that are not in LFS/Xet, not just large
          # ones — the 10 MiB rule caught the .pth weights, and a separate rule
          # (~100 KB) caught demo_subjects/*.png. Declare LFS for every binary
          # extension in the snapshot rather than chasing thresholds. This is
          # appended here, not committed to the GitHub repo, because converting
          # them upstream would require pushing LFS objects to GitHub too.
          #
          # Emptying the index is what makes the conversion happen at all. A
          # plain `git add -A` sees byte-identical content and skips the clean
          # filter, leaving the files as raw blobs — verified, it does not work.
          # Re-adding from an empty index forces every path through its filter.
          #
          # Use read-tree rather than `git rm -r --cached .`: rm refuses to act
          # on a path whose staged content differs from both the file and HEAD,
          # which is exactly the state 4a/4b are in here (HEAD has a raw blob,
          # the *.pth filter cleans the working file to a pointer). That aborted
          # deploy run #3. read-tree empties the index unconditionally and never
          # touches the working tree.
          #
          # Note this only reproduces once git's stat cache is invalidated — a
          # plain fresh checkout hides the discrepancy because git trusts stat
          # info and skips the filter, but `git lfs checkout` touches the files
          # and forces the comparison. Simulate with `touch *.pth` when testing.
          git read-tree --empty
          for ext in png jpg jpeg bmp tif tiff gif dcm npy npz pkl pt pdf; do
            printf '*.%s filter=lfs diff=lfs merge=lfs -text\n' "$ext" >> .gitattributes
          done
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REPOSITORY}"
          echo "LFS objects in the snapshot:"
          git lfs ls-files

          # Guard: every non-empty binary blob in the snapshot must be an LFS
          # pointer. Checking the invariant directly beats guessing HF's size
          # thresholds, which differ per rule and are not documented precisely.
          lfs_list="$(git lfs ls-files --name-only | sort -u)"
          violations=0
          while read -r mode type oid size path; do
            [ -z "${size:-}" ] && continue
            [ "$size" = "-" ] && continue
            [ "$size" -eq 0 ] && continue
            if printf '%s\n' "$lfs_list" | grep -qxF -- "$path"; then continue; fi
            # Binary test = a NUL byte in the first 8 KB, which is git's own
            # heuristic. Do NOT use `grep -I`: in the C locale it reports valid
            # UTF-8 (em dashes, arrows, emoji) as binary, which false-positives
            # on app.py, inference.py and every notebook.
            # `set +o pipefail` is scoped to each substitution's subshell:
            # head -c closes the pipe early, git cat-file takes SIGPIPE, and
            # with pipefail on that aborts the whole step (exit 141).
            head_bytes="$(set +o pipefail; git cat-file blob "$oid" | head -c 8000 | wc -c)"
            head_nonnul="$(set +o pipefail; git cat-file blob "$oid" | head -c 8000 | tr -d '\000' | wc -c)"
            if [ "$head_bytes" -ne "$head_nonnul" ]; then
              echo "::error::$path is a binary file (${size} bytes) not tracked by LFS;" \
                   "HF will reject the push. Add its extension to the LFS list in this workflow."
              violations=$((violations + 1))
            fi
          done < <(git ls-tree -r -l HEAD)
          if [ "$violations" -gt 0 ]; then
            echo "::error::$violations binary file(s) would be rejected by Hugging Face."
            exit 1
          fi
          echo "Binary-file guard: OK"

          push_space() {
            local space="$1"
            echo "::group::Pushing to $space"
            # Token goes in the URL, so keep it out of the log and out of
            # .git/config on disk beyond this step.
            git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${space}" \
              HEAD:refs/heads/main 2>&1 | sed "s|${HF_TOKEN}|***|g"
            echo "::endgroup::"
          }

          case "$TARGET" in
            api)       push_space "$API_SPACE" ;;
            streamlit) push_space "$STREAMLIT_SPACE" ;;
            both)      push_space "$API_SPACE"; push_space "$STREAMLIT_SPACE" ;;
            *) echo "::error::Unknown target '$TARGET'"; exit 1 ;;
          esac

      - name: Summary
        env:
          API_SPACE: ${{ vars.HF_API_SPACE || 'TarunSadarla2606/fetal-head-clinical-ai-api' }}
          STREAMLIT_SPACE: ${{ vars.HF_STREAMLIT_SPACE || 'TarunSadarla2606/fetal-head-clinical-ai' }}
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA::7}\` to Hugging Face"
            echo
            echo "- API: https://huggingface.co/spaces/${API_SPACE}"
            echo "- Streamlit: https://huggingface.co/spaces/${STREAMLIT_SPACE}"
            echo
            echo "Each Space rebuilds its container after the push; watch its"
            echo "**Logs** tab for the build to finish before testing."
          } >> "$GITHUB_STEP_SUMMARY"
